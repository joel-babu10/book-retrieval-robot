<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Book Retrieval Console</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0E1318;color:#E6EAEE;font-family:'IBM Plex Sans',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1360px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.grid{display:grid;grid-template-columns:minmax(0,860px) minmax(320px,1fr);gap:20px}
.col{display:flex;flex-direction:column;gap:16px}
.card{background:#161D25;border:1px solid #2A3540;border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.card.hit{border-color:#F2B84B}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8C98A4}
.pill{padding:7px 12px;border:1px solid #2A3540;border-radius:6px;font-size:12px}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.btn{height:44px;border-radius:6px;border:1px solid #2A3540;background:#0E1318;color:#E6EAEE;font-size:13px}
.primary{background:#F2B84B;color:#14100A;border:0;font-weight:600;font-size:14px;height:46px}
.primary:disabled{opacity:.5}
.modes{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #2A3540;border-radius:6px;overflow:hidden}
.modes button{height:44px;border:0;background:#0E1318;color:#B7C0C9;font-size:12px}
.modes button.on{background:#F2B84B;color:#14100A;font-weight:600}
.cam{position:relative;aspect-ratio:860/484;border-radius:10px;overflow:hidden;border:1px solid #2A3540;background:#161D25}
.cam img{width:100%;height:100%;object-fit:contain;display:block}
.chip{position:absolute;left:14px;top:14px;background:rgba(14,19,24,.85);padding:5px 9px;border-radius:4px;color:#B7C0C9;font-size:11px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.step{border-top:3px dashed #4A5663;padding-top:8px}
.step.done{border-top:3px solid #3DD6B0}
.step .s{font-size:11px;color:#8C98A4}.step.done .s{color:#3DD6B0}
.step .n{font-size:13px;font-weight:500;margin-top:2px}
.step .d{font-size:11px;color:#8C98A4;margin-top:2px}
.xyz{background:#0E1318;border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.6;white-space:pre}
.xyz small{display:block;font:11px 'IBM Plex Sans';color:#8C98A4;margin-bottom:6px}
input[type=text]{flex:1;background:#0E1318;border:1px solid #2A3540;border-radius:6px;color:#E6EAEE;font:14px 'IBM Plex Sans';padding:0 12px;height:44px}
#log{font-size:11.5px;line-height:1.7;color:#B7C0C9;overflow:auto;max-height:180px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">

<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
 <div><div style="font-size:22px;font-weight:600">Book Retrieval Console</div>
 <div style="font-size:13px;color:#8C98A4">Find a book, locate it in 3D, hand the target to the arm</div></div>
 <div class="mono" style="display:flex;gap:10px"><div class="pill" id="pMode" style="color:#F2B84B">Mode: auto</div></div>
</div>

<div class="grid">
 <div class="col">
  <div class="cam"><img id="feed" src="/video_feed" alt="Live camera view"><div class="chip mono">Live / annotated</div></div>
  <div class="card"><div class="lbl">Pipeline</div>
   <div class="steps" id="steps"></div></div>
 </div>

 <div class="col">
  <div class="card">
   <label class="lbl" for="q">Request a book</label>
   <div style="display:flex;gap:8px">
    <input id="q" type="text" placeholder="Title or author">
    <button class="btn" id="mic" style="width:44px" aria-label="Speak query">
     <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
   </div>
   <div class="modes" id="modes">
    <button data-m="auto" class="on">Auto</button><button data-m="spine">Spine</button>
    <button data-m="scattered">Scattered</button><button data-m="mixed">Mixed</button></div>
   <button class="primary" id="go">Find book</button>
  </div>

  <div class="card hit" id="res" style="display:none">
   <div style="display:flex;justify-content:space-between;align-items:baseline">
    <div class="lbl" style="color:#F2B84B">Target located</div><div class="mono" id="score" style="font-size:12px;color:#B7C0C9"></div></div>
   <div id="title" style="font-size:18px;font-weight:600"></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="xyz mono"><small>Camera frame (m)</small><span id="cam"></span></div>
    <div class="xyz mono" style="border:1px dashed #4A5663"><small>Robot frame</small><span id="rob"></span></div></div>
   <div id="note" style="font-size:12px;color:#B7C0C9"></div>
   <div style="display:flex;gap:8px">
    <button class="btn" id="send" style="flex:1" disabled>Send to arm</button>
    <button class="btn" id="rescan" style="width:96px">Re-scan</button></div>
  </div>

  <div class="card" style="flex:1"><div class="lbl">Log</div><div id="log" class="mono"></div></div>
 </div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const STEPS=[["Query","text / voice"],["Mode gate",""],["OBB + SAM",""],["OCR match",""],["Depth to XYZ",""],["Robot frame","transform"]];
let mode="auto";
function renderSteps(n,d={}){
  $("steps").innerHTML=STEPS.map((s,i)=>`<div class="step ${i<n?"done":""}"><div class="s mono">${i+1} ${i<n?"done":"pending"}</div><div class="n">${s[0]}</div><div class="d">${d[i]||s[1]}</div></div>`).join("");
}
renderSteps(0);
function log(t,c){const l=$("log"),e=document.createElement("div");e.textContent=new Date().toTimeString().slice(0,8)+" "+t;if(c)e.style.color=c;l.appendChild(e);l.scrollTop=l.scrollHeight}
const fmt=a=>a?`X ${a[0].toFixed(3)}\nY ${a[1].toFixed(3)}\nZ ${a[2].toFixed(3)}`:"X --\nY --\nZ --";
$("modes").onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;
  [...$("modes").children].forEach(x=>x.classList.toggle("on",x===b));$("pMode").textContent="Mode: "+mode};
async function find(){
  const query=$("q").value.trim();if(!query){$("q").focus();return}
  $("go").disabled=true;$("go").textContent="Searching...";log(`query: "${query}"`);log("gate: "+mode);
  try{
    const r=await fetch("/api/find",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query,mode})});
    const d=await r.json();
    if(!d.found){log("no match","#F2B84B");$("res").style.display="none";renderSteps(4)}
    else{
      $("res").style.display="flex";$("title").textContent=d.title;
      $("score").textContent=`conf ${d.conf.toFixed(2)} / sim ${d.sim.toFixed(2)}`;
      $("cam").textContent=fmt(d.cam_xyz);$("rob").textContent=fmt(d.robot_xyz);
      $("rob").style.color=d.robot_xyz?"#E6EAEE":"#8C98A4";
      $("note").textContent=d.pick_note?"Pick point: "+d.pick_note:"";
      $("send").disabled=!d.robot_xyz;$("send").textContent=d.robot_xyz?"Send to arm":"Send to arm (needs Step 6)";
      renderSteps(d.robot_xyz?6:5,{1:d.mode});
      log("xyz: "+d.cam_xyz.map(v=>v.toFixed(3)).join(", "),"#3DD6B0");
    }
  }catch(e){log("error: "+e.message,"#F2B84B")}
  $("go").disabled=false;$("go").textContent="Find book";
}
$("go").onclick=find;$("rescan").onclick=find;$("q").onkeydown=e=>{if(e.key==="Enter")find()};
$("send").onclick=async()=>{
  $("send").disabled=true;
  const r=await fetch("/api/send",{method:"POST"});const d=await r.json();
  log(d.ok?"arm: command sent":"arm: failed "+(d.error||""),d.ok?"#3DD6B0":"#F2B84B");$("send").disabled=false};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){$("mic").onclick=()=>{const r=new SR();r.lang="en-US";r.onresult=e=>{$("q").value=e.results[0][0].transcript;find()};r.start();log("listening...")}}
else $("mic").disabled=true;
</script></body></html>
